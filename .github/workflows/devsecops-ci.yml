name: Mesh Orchestrator CI

on: [push, pull_request]

jobs:
  audit-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Static Application Security Testing (Bandit SAST)
        run: |
          bandit -r orchestrator/ -ll

      - name: Style & Linting Enforcement (Flake8)
        run: |
          flake8 orchestrator/ tests/ --count --ignore=W292 --max-line-length=100 --statistics

      - name: Execute Service Registry & Security Test Suite
        run: |
          PYTHONPATH=. pytest tests/ -v

      - name: Build Hardened Container Image
        run: |
          docker build -t gitops-mesh-orchestrator:latest .